<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#071a2b">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=12">
<title>Products | Slow Rider Wholesale Vehicles</title>
<meta name="description" content="Browse all current Slow Rider vehicle products, specifications and images.">
</head>
<body data-page="products">
<div id="siteHeader"></div>

<main>
  <section class="page-hero compact-hero">
    <div class="container page-hero-grid">
      <div><span class="eyebrow">WHOLESALE VEHICLE CATALOG</span><h1>Find the right vehicle for your market.</h1><p>Browse all existing Slow Rider product data, specifications and images in one professional catalog.</p></div>
      <div class="hero-mini-card"><strong id="catalogTotal">66</strong><span>Current product records</span></div>
    </div>
  </section>
  <section class="catalog-area">
    <div class="container catalog-toolbar">
      <div class="filter-scroll" id="categoryFilters"></div>
      <div class="catalog-search-wrap">
        <span>⌕</span><input id="productSearch" type="search" placeholder="Search model, category or specification…" autocomplete="off"><button id="clearProductSearch" type="button" aria-label="Clear search">×</button>
      </div>
    </div>
    <div class="container catalog-status"><strong id="catalogResultCount">66 products</strong><span id="catalogStatusText">Showing all products</span></div>
    <div class="container product-grid catalog-product-grid" id="catalogView"></div>
    <div class="container empty-state" id="catalogEmpty" hidden><h3>No matching products</h3><p>Try another search term or category.</p></div>
  </section>
</main>
<div id="siteFooter"></div>
<script src="script.js?v=12"></script>
</body>
</html>
